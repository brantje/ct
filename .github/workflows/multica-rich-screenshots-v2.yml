name: Multica rich screenshots v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/multica-rich-screenshots-v2.yml
      - multica-rich-v2.spec.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Clone Multica
        run: git clone --depth 1 https://github.com/multica-ai/multica.git multica
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: multica
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Configure stack
        working-directory: multica
        run: |
          FORCE=1 WORKTREE_NAME=ci bash scripts/init-worktree-env.sh .env
          sed -i 's/^POSTGRES_DB=.*/POSTGRES_DB=multica/' .env
          sed -i 's/^DATABASE_URL=.*/DATABASE_URL=postgres:\/\/multica:multica@localhost:5432\/multica?sslmode=disable/' .env
          sed -i 's/^PORT=.*/PORT=8080/' .env
          sed -i 's/^FRONTEND_PORT=.*/FRONTEND_PORT=3000/' .env
          sed -i 's#^FRONTEND_ORIGIN=.*#FRONTEND_ORIGIN=http://localhost:3000#' .env
          sed -i 's#^NEXT_PUBLIC_API_URL=.*#NEXT_PUBLIC_API_URL=http://localhost:8080#' .env
          printf '\nAPP_ENV=development\n' >> .env
          cat > docker-compose.screenshots.yml <<'EOF'
          services:
            postgres:
              ports:
                - "127.0.0.1:5432:5432"
          EOF
      - name: Start Multica
        working-directory: multica
        run: |
          docker compose -f docker-compose.selfhost.yml -f docker-compose.screenshots.yml up -d
          for i in $(seq 1 90); do
            b="$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/ 2>/dev/null || true)"
            f="$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:3000/login 2>/dev/null || true)"
            if [ "$b" != "000" ] && [ -n "$b" ] && [ "$f" = "200" ]; then break; fi
            if [ "$i" = 90 ]; then exit 1; fi
            sleep 3
          done
      - name: Install capture spec
        run: cp multica-rich-v2.spec.ts multica/e2e/chatgpt-rich-v2.spec.ts
      - name: Capture
        working-directory: multica
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          FRONTEND_ORIGIN: http://localhost:3000
          DATABASE_URL: postgres://multica:multica@localhost:5432/multica?sslmode=disable
          SCREENSHOT_DIR: artifacts/multica-rich-screenshots
        run: pnpm exec playwright test e2e/chatgpt-rich-v2.spec.ts --project=chromium --reporter=line
      - name: Diagnostics
        if: failure()
        working-directory: multica
        run: docker compose -f docker-compose.selfhost.yml -f docker-compose.screenshots.yml logs --tail=300 || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multica-rich-screenshots-v2
          path: multica/artifacts/multica-rich-screenshots
          if-no-files-found: warn
          retention-days: 7
