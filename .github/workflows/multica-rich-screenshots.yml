name: Multica rich screenshots

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/multica-rich-screenshots.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout runner repo
        uses: actions/checkout@v6

      - name: Clone Multica
        run: git clone --depth 1 https://github.com/multica-ai/multica.git multica

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: multica
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Configure self-host stack
        working-directory: multica
        run: |
          jwt="$(openssl rand -hex 32)"
          cat > .env <<EOF
          JWT_SECRET=$jwt
          APP_ENV=development
          MULTICA_DEV_VERIFICATION_CODE=123456
          ALLOW_SIGNUP=true
          FRONTEND_ORIGIN=http://localhost:3000
          MULTICA_APP_URL=http://localhost:3000
          DATABASE_URL=postgres://multica:multica@localhost:5432/multica?sslmode=disable
          POSTGRES_DB=multica
          POSTGRES_USER=multica
          POSTGRES_PASSWORD=multica
          EOF
          cat > docker-compose.screenshots.yml <<'EOF'
          services:
            postgres:
              ports:
                - "127.0.0.1:5432:5432"
          EOF

      - name: Start Multica
        working-directory: multica
        run: |
          docker compose -f docker-compose.selfhost.yml -f docker-compose.screenshots.yml up -d
          for i in $(seq 1 90); do
            backend="$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/ 2>/dev/null || true)"
            frontend="$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:3000/login 2>/dev/null || true)"
            if [ "$backend" != "000" ] && [ -n "$backend" ] && [ "$frontend" = "200" ]; then
              echo "ready: backend=$backend frontend=$frontend"
              break
            fi
            if [ "$i" = 90 ]; then
              docker compose -f docker-compose.selfhost.yml -f docker-compose.screenshots.yml ps
              docker compose -f docker-compose.selfhost.yml -f docker-compose.screenshots.yml logs --tail=250
              exit 1
            fi
            sleep 3
          done

      - name: Add rich screenshot test
        working-directory: multica
        run: |
          cat > e2e/chatgpt-rich-screenshots.spec.ts <<'EOF'
          import { test, type Browser } from "@playwright/test";
          import pg from "pg";
          import { mkdir, writeFile } from "node:fs/promises";
          import { join } from "node:path";
          import { createTestApi } from "./helpers";

          const BASE = process.env.PLAYWRIGHT_BASE_URL ?? "http://localhost:3000";
          const DB = process.env.DATABASE_URL ?? "postgres://multica:multica@localhost:5432/multica?sslmode=disable";
          const OUT = process.env.SCREENSHOT_DIR ?? "artifacts/multica-rich-screenshots";
          const NIL = "00000000-0000-0000-0000-000000000000";

          type Row = {
            template: string;
            requestedUrl: string;
            finalUrl: string;
            status: number | null;
            screenshot: string;
            title: string;
            note: string;
            error: string;
          };

          function fileName(template: string, index: number) {
            const slug = template === "/" ? "root" : template
              .replace(/^\//, "")
              .replace(/\[([^\]]+)\]/g, "$1")
              .replace(/[^a-zA-Z0-9._-]+/g, "-")
              .replace(/^-+|-+$/g, "");
            return `${String(index + 1).padStart(2, "0")}-${slug}.png`;
          }

          async function saveManifest(rows: Row[]) {
            await writeFile(join(OUT, "manifest.json"), JSON.stringify(rows, null, 2) + "\n");
            const cols: (keyof Row)[] = ["template", "requestedUrl", "finalUrl", "status", "screenshot", "title", "note", "error"];
            const q = (v: unknown) => `"${String(v ?? "").replaceAll('"', '""')}"`;
            await writeFile(join(OUT, "manifest.csv"), [cols.join(","), ...rows.map(r => cols.map(k => q(r[k])).join(","))].join("\n") + "\n");
          }

          async function capture(browser: Browser, token: string | null, template: string, path: string, index: number, note: string, rows: Row[]) {
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 }, colorScheme: "light" });
            if (token) {
              await context.addInitScript((t) => {
                localStorage.setItem("multica_token", t);
                localStorage.setItem("multica:chat:isOpen", "false");
              }, token);
            }
            const page = await context.newPage();
            const requestedUrl = new URL(path, BASE).toString();
            const screenshot = fileName(template, index);
            let status: number | null = null;
            let error = "";
            try {
              const response = await page.goto(requestedUrl, { waitUntil: "domcontentloaded", timeout: 20_000 });
              status = response?.status() ?? null;
              await page.waitForLoadState("networkidle", { timeout: 4_000 }).catch(() => {});
              await page.waitForTimeout(700);
            } catch (e) {
              error = e instanceof Error ? e.message : String(e);
            }
            let title = "";
            try { title = await page.title(); } catch {}
            try {
              await page.screenshot({ path: join(OUT, screenshot), fullPage: true, animations: "disabled", timeout: 20_000 });
            } catch (e) {
              const msg = e instanceof Error ? e.message : String(e);
              error = error ? `${error} | screenshot: ${msg}` : `screenshot: ${msg}`;
            }
            rows.push({ template, requestedUrl, finalUrl: page.url(), status, screenshot, title, note, error });
            await saveManifest(rows);
            await context.close().catch(() => {});
          }

          test("capture richly seeded Multica", async ({ browser }) => {
            test.setTimeout(15 * 60_000);
            await mkdir(OUT, { recursive: true });

            const api = await createTestApi();
            const workspace = (await api.getWorkspaces())[0];
            if (!workspace) throw new Error("E2E workspace missing");
            api.setWorkspaceId(workspace.id);
            api.setWorkspaceSlug(workspace.slug);
            const token = api.getToken();
            if (!token) throw new Error("E2E token missing");

            const issues = await api.seedTableIssues([
              { title: "Implement OAuth callback validation", status: "in_progress", priority: "urgent" },
              { title: "Fix flaky task cancellation", status: "in_review", priority: "high" },
              { title: "Add runtime heartbeat metrics", status: "todo", priority: "medium" },
              { title: "Investigate context window regression", status: "blocked", priority: "high" },
              { title: "Ship agent usage dashboard", status: "done", priority: "medium" },
              { title: "Document squad handoff flow", status: "backlog", priority: "low" },
              { title: "Reduce cold-start latency", status: "in_progress", priority: "high" },
              { title: "Review plugin permission model", status: "in_review", priority: "medium" },
              { title: "Improve issue search relevance", status: "todo", priority: "medium" },
              { title: "Handle stale runtime disconnects", status: "done", priority: "high" },
              { title: "Prototype release-note agent", status: "backlog", priority: "low" },
              { title: "Repair webhook retry backoff", status: "blocked", priority: "urgent" },
            ]);

            const db = new pg.Client(DB);
            await db.connect();
            const warnings: string[] = [];
            const safe = async <T>(label: string, fn: () => Promise<T>, fallback: T): Promise<T> => {
              try { return await fn(); }
              catch (e) {
                const msg = `${label}: ${e instanceof Error ? e.message : String(e)}`;
                warnings.push(msg);
                console.warn(msg);
                return fallback;
              }
            };
            const id = async (label: string, sql: string, params: unknown[] = []) => safe(label, async () => {
              const r = await db.query<{ id: string }>(sql, params);
              return r.rows[0]?.id ?? NIL;
            }, NIL);

            const userId = await id("user", `SELECT id::text AS id FROM "user" WHERE email=$1 LIMIT 1`, [api.getEmail()]);
            const memberId = await id("member", `SELECT id::text AS id FROM member WHERE workspace_id=$1 AND user_id=$2 LIMIT 1`, [workspace.id, userId]);

            const runtimeA = await id("runtime A", `INSERT INTO agent_runtime (workspace_id, daemon_id, name, runtime_mode, provider, status, device_info, metadata, last_seen_at) VALUES ($1,NULL,'Mac Studio — Codex','cloud','codex','online','macOS arm64','{"cpu":"Apple M4 Max","memory":"64 GB"}'::jsonb,now()) RETURNING id::text AS id`, [workspace.id]);
            const runtimeB = await id("runtime B", `INSERT INTO agent_runtime (workspace_id, daemon_id, name, runtime_mode, provider, status, device_info, metadata, last_seen_at) VALUES ($1,NULL,'Linux Builder — Claude','cloud','claude_code','online','Ubuntu 24.04 x86_64','{"cpu":"16 vCPU","memory":"32 GB"}'::jsonb,now()-interval '8 seconds') RETURNING id::text AS id`, [workspace.id]);
            const runtimeC = await id("runtime C", `INSERT INTO agent_runtime (workspace_id, daemon_id, name, runtime_mode, provider, status, device_info, metadata, last_seen_at) VALUES ($1,NULL,'CI Runner — Gemini','cloud','gemini_cli','online','GitHub Actions Linux','{"cpu":"4 vCPU","memory":"16 GB"}'::jsonb,now()-interval '25 seconds') RETURNING id::text AS id`, [workspace.id]);

            const agentA = await id("agent A", `INSERT INTO agent (workspace_id,name,description,instructions,runtime_mode,runtime_config,runtime_id,visibility,status,max_concurrent_tasks,owner_id) VALUES ($1,'Backend Engineer','Owns API reliability and database work','Keep changes small, tested, and production-safe.','cloud','{}'::jsonb,$2,'workspace','working',3,$3) RETURNING id::text AS id`, [workspace.id, runtimeA, userId]);
            const agentB = await id("agent B", `INSERT INTO agent (workspace_id,name,description,instructions,runtime_mode,runtime_config,runtime_id,visibility,status,max_concurrent_tasks,owner_id) VALUES ($1,'Frontend Engineer','Builds product UI and interaction polish','Prefer accessible components and strong loading states.','cloud','{}'::jsonb,$2,'workspace','working',2,$3) RETURNING id::text AS id`, [workspace.id, runtimeB, userId]);
            const agentC = await id("agent C", `INSERT INTO agent (workspace_id,name,description,instructions,runtime_mode,runtime_config,runtime_id,visibility,status,max_concurrent_tasks,owner_id) VALUES ($1,'Code Reviewer','Reviews risky changes and test coverage','Prioritize correctness, regressions, and security.','cloud','{}'::jsonb,$2,'workspace','idle',2,$3) RETURNING id::text AS id`, [workspace.id, runtimeC, userId]);
            const agentD = await id("agent D", `INSERT INTO agent (workspace_id,name,description,instructions,runtime_mode,runtime_config,runtime_id,visibility,status,max_concurrent_tasks,owner_id) VALUES ($1,'Release Captain','Coordinates releases and incident follow-up','Surface blockers early and keep release notes current.','cloud','{}'::jsonb,$2,'workspace','blocked',1,$3) RETURNING id::text AS id`, [workspace.id, runtimeB, userId]);

            await safe("daemon connections", async () => {
              await db.query(`INSERT INTO daemon_connection (agent_id,daemon_id,status,last_heartbeat_at,runtime_info) VALUES ($1,'seed-daemon-backend','connected',now(),'{"version":"0.4.43"}'::jsonb),($2,'seed-daemon-frontend','connected',now()-interval '5 seconds','{"version":"0.4.43"}'::jsonb)`, [agentA, agentB]);
            }, undefined);

            const projectA = await id("project A", `INSERT INTO project (workspace_id,title,description,icon,status,lead_type,lead_id) VALUES ($1,'Agent Platform','Core runtime, orchestration, and reliability work','bot','in_progress','agent',$2) RETURNING id::text AS id`, [workspace.id, agentA]);
            const projectB = await id("project B", `INSERT INTO project (workspace_id,title,description,icon,status,lead_type,lead_id) VALUES ($1,'Web Experience','Workspace UI, collaboration, and onboarding','sparkles','in_progress','agent',$2) RETURNING id::text AS id`, [workspace.id, agentB]);

            await safe("assign issues", async () => {
              const assignments = [
                [issues[0]!.id, agentA, projectA], [issues[1]!.id, agentC, projectA], [issues[2]!.id, agentA, projectA],
                [issues[3]!.id, agentD, projectA], [issues[4]!.id, agentB, projectB], [issues[5]!.id, agentB, projectB],
                [issues[6]!.id, agentA, projectA], [issues[7]!.id, agentC, projectA], [issues[8]!.id, agentB, projectB],
                [issues[9]!.id, agentA, projectA], [issues[10]!.id, agentB, projectB], [issues[11]!.id, agentD, projectA],
              ];
              for (const [issueId, agentId, projectId] of assignments) {
                await db.query(`UPDATE issue SET assignee_type='agent', assignee_id=$2, project_id=$3, updated_at=now() WHERE id=$1`, [issueId, agentId, projectId]);
              }
            }, undefined);

            const taskRunningA = await id("running task A", `INSERT INTO agent_task_queue (agent_id,issue_id,status,priority,dispatched_at,started_at,created_at) VALUES ($1,$2,'running',100,now()-interval '9 minutes',now()-interval '8 minutes',now()-interval '10 minutes') RETURNING id::text AS id`, [agentA, issues[0]!.id]);
            const taskRunningB = await id("running task B", `INSERT INTO agent_task_queue (agent_id,issue_id,status,priority,dispatched_at,started_at,created_at) VALUES ($1,$2,'running',80,now()-interval '5 minutes',now()-interval '4 minutes',now()-interval '6 minutes') RETURNING id::text AS id`, [agentB, issues[6]!.id]);
            const taskDispatched = await id("dispatched task", `INSERT INTO agent_task_queue (agent_id,issue_id,status,priority,dispatched_at,created_at) VALUES ($1,$2,'dispatched',60,now()-interval '90 seconds',now()-interval '2 minutes') RETURNING id::text AS id`, [agentC, issues[1]!.id]);
            const taskCompleted = await id("completed task", `INSERT INTO agent_task_queue (agent_id,issue_id,status,priority,dispatched_at,started_at,completed_at,result,created_at) VALUES ($1,$2,'completed',50,now()-interval '42 minutes',now()-interval '41 minutes',now()-interval '18 minutes','{"summary":"Added heartbeat metrics and tests","filesChanged":6}'::jsonb,now()-interval '43 minutes') RETURNING id::text AS id`, [agentA, issues[9]!.id]);
            const taskFailed = await id("failed task", `INSERT INTO agent_task_queue (agent_id,issue_id,status,priority,dispatched_at,started_at,completed_at,error,created_at) VALUES ($1,$2,'failed',95,now()-interval '31 minutes',now()-interval '30 minutes',now()-interval '27 minutes','Integration test failed after webhook provider returned 429',now()-interval '32 minutes') RETURNING id::text AS id`, [agentD, issues[11]!.id]);
            await id("queued task", `INSERT INTO agent_task_queue (agent_id,issue_id,status,priority,created_at) VALUES ($1,$2,'queued',40,now()-interval '30 seconds') RETURNING id::text AS id`, [agentC, issues[7]!.id]);

            await safe("comments", async () => {
              await db.query(`INSERT INTO comment (issue_id,author_type,author_id,content,type,created_at) VALUES
                ($1,'agent',$5,'I traced the callback mismatch to state validation. Implementing the fix and adding regression coverage now.','progress_update',now()-interval '6 minutes'),
                ($1,'member',$6,'Please keep backward compatibility for existing OAuth installs.','comment',now()-interval '4 minutes'),
                ($2,'agent',$7,'Review found one cancellation race around terminal task settlement.','comment',now()-interval '12 minutes'),
                ($3,'agent',$5,'Heartbeat metrics are merged; watching runtime churn before closing.','progress_update',now()-interval '22 minutes'),
                ($4,'agent',$8,'Blocked on reproducing the context regression with the current provider build.','progress_update',now()-interval '18 minutes')`, [issues[0]!.id, issues[1]!.id, issues[2]!.id, issues[3]!.id, agentA, userId, agentC, agentD]);
            }, undefined);

            await safe("labels", async () => {
              const bug = await id("bug label", `INSERT INTO issue_label (workspace_id,name,color) VALUES ($1,'bug','#ef4444') RETURNING id::text AS id`, [workspace.id]);
              const infra = await id("infra label", `INSERT INTO issue_label (workspace_id,name,color) VALUES ($1,'infra','#8b5cf6') RETURNING id::text AS id`, [workspace.id]);
              const ui = await id("ui label", `INSERT INTO issue_label (workspace_id,name,color) VALUES ($1,'ui','#3b82f6') RETURNING id::text AS id`, [workspace.id]);
              await db.query(`INSERT INTO issue_to_label (issue_id,label_id) VALUES ($1,$4),($2,$5),($3,$6) ON CONFLICT DO NOTHING`, [issues[11]!.id, issues[2]!.id, issues[4]!.id, bug, infra, ui]);
            }, undefined);

            const skillA = await id("skill A", `INSERT INTO skill (workspace_id,name,description,content,config,created_by) VALUES ($1,'PostgreSQL Debugging','Investigate query plans, locks, and migration failures','# PostgreSQL Debugging\n\nInspect plans, locks, constraints, and migration history before changing data.','{}'::jsonb,$2) RETURNING id::text AS id`, [workspace.id, userId]);
            const skillB = await id("skill B", `INSERT INTO skill (workspace_id,name,description,content,config,created_by) VALUES ($1,'Frontend QA','Systematically verify visual, accessibility, and interaction regressions','# Frontend QA\n\nCheck responsive layouts, keyboard access, loading states, and regressions.','{}'::jsonb,$2) RETURNING id::text AS id`, [workspace.id, userId]);
            await safe("agent skills", async () => {
              await db.query(`INSERT INTO agent_skill (agent_id,skill_id) VALUES ($1,$3),($2,$4) ON CONFLICT DO NOTHING`, [agentA, agentB, skillA, skillB]);
            }, undefined);

            const squadId = await id("squad", `INSERT INTO squad (workspace_id,name,description,leader_id,creator_id) VALUES ($1,'Platform Squad','Backend engineer, reviewer, and release captain working as one delivery unit',$2,$3) RETURNING id::text AS id`, [workspace.id, agentA, userId]);
            await safe("squad members", async () => {
              await db.query(`INSERT INTO squad_member (squad_id,member_type,member_id,role) VALUES ($1,'agent',$2,'lead'),($1,'agent',$3,'reviewer'),($1,'agent',$4,'release') ON CONFLICT DO NOTHING`, [squadId, agentA, agentC, agentD]);
            }, undefined);

            const autopilotId = await id("autopilot", `INSERT INTO autopilot (workspace_id,project_id,title,description,assignee_id,priority,status,execution_mode,issue_title_template,concurrency_policy,created_by_type,created_by_id,last_run_at) VALUES ($1,$2,'Nightly reliability sweep','Every night, inspect runtime health and open a focused reliability issue when action is needed',$3,'high','active','create_issue','Nightly reliability findings','skip','member',$4,now()-interval '1 day') RETURNING id::text AS id`, [workspace.id, projectA, agentA, userId]);
            const triggerId = await id("autopilot trigger", `INSERT INTO autopilot_trigger (autopilot_id,kind,enabled,cron_expression,timezone,next_run_at,label,last_fired_at) VALUES ($1,'schedule',true,'0 2 * * *','Europe/Amsterdam',now()+interval '5 hours','Nightly at 02:00',now()-interval '1 day') RETURNING id::text AS id`, [autopilotId]);
            const runCompleted = await id("autopilot completed run", `INSERT INTO autopilot_run (autopilot_id,trigger_id,source,status,issue_id,task_id,triggered_at,completed_at,result) VALUES ($1,$2,'schedule','completed',$3,$4,now()-interval '1 day',now()-interval '23 hours 42 minutes','{"summary":"Heartbeat drift found and repaired"}'::jsonb) RETURNING id::text AS id`, [autopilotId, triggerId, issues[9]!.id, taskCompleted]);
            const runRunning = await id("autopilot running run", `INSERT INTO autopilot_run (autopilot_id,trigger_id,source,status,issue_id,task_id,triggered_at) VALUES ($1,$2,'manual','running',$3,$4,now()-interval '8 minutes') RETURNING id::text AS id`, [autopilotId, triggerId, issues[0]!.id, taskRunningA]);
            await id("autopilot failed run", `INSERT INTO autopilot_run (autopilot_id,trigger_id,source,status,issue_id,task_id,triggered_at,completed_at,failure_reason) VALUES ($1,$2,'api','failed',$3,$4,now()-interval '3 days',now()-interval '3 days'+interval '4 minutes','Provider rate limit exhausted') RETURNING id::text AS id`, [autopilotId, triggerId, issues[11]!.id, taskFailed]);
            await safe("link autopilot tasks", async () => {
              await db.query(`UPDATE agent_task_queue SET autopilot_run_id=$2 WHERE id=$1`, [taskRunningA, runRunning]);
              await db.query(`UPDATE agent_task_queue SET autopilot_run_id=$2 WHERE id=$1`, [taskCompleted, runCompleted]);
            }, undefined);

            const chatSessionId = await id("chat session", `INSERT INTO chat_session (workspace_id,agent_id,creator_id,title,status) VALUES ($1,$2,$3,'OAuth callback incident','active') RETURNING id::text AS id`, [workspace.id, agentA, userId]);
            await safe("chat messages", async () => {
              await db.query(`INSERT INTO chat_message (chat_session_id,role,content,created_at,quick_actions) VALUES
                ($1,'user','Can you investigate why OAuth callbacks started failing after the last deployment?',now()-interval '11 minutes','[]'::jsonb),
                ($1,'assistant','I found the regression in callback state validation. I have a fix in progress and I am adding compatibility coverage before marking it ready for review.',now()-interval '9 minutes',$2::jsonb),
                ($1,'user','Keep compatibility with existing installs and flag anything that needs a migration.',now()-interval '7 minutes','[]'::jsonb)`, [chatSessionId, JSON.stringify([{label:"Show current diff",prompt:"Show me the current diff and remaining risks.",primary:true},{label:"Summarize tests",prompt:"Summarize the regression tests you added."}])]);
            }, undefined);

            await safe("inbox", async () => {
              await db.query(`INSERT INTO inbox_item (workspace_id,recipient_type,recipient_id,type,severity,issue_id,title,body,read,archived,created_at) VALUES
                ($1,'member',$2,'review','action_required',$3,'Review requested: OAuth callback validation','Backend Engineer finished the first implementation pass and requested review.',false,false,now()-interval '3 minutes'),
                ($1,'member',$2,'agent_update','attention',$4,'Release Captain is blocked','Context regression reproduction needs a fresh provider build.',false,false,now()-interval '17 minutes'),
                ($1,'member',$2,'run_complete','info',$5,'Nightly reliability sweep completed','Runtime heartbeat drift was detected and repaired.',true,false,now()-interval '23 hours')`, [workspace.id, memberId, issues[0]!.id, issues[3]!.id, issues[9]!.id]);
            }, undefined);

            await safe("activity", async () => {
              await db.query(`INSERT INTO activity_log (workspace_id,issue_id,actor_type,actor_id,action,details,created_at) VALUES
                ($1,$2,'agent',$5,'task_started','{"agent":"Backend Engineer"}'::jsonb,now()-interval '8 minutes'),
                ($1,$3,'agent',$6,'review_started','{"agent":"Code Reviewer"}'::jsonb,now()-interval '12 minutes'),
                ($1,$4,'system',NULL,'autopilot_completed','{"autopilot":"Nightly reliability sweep"}'::jsonb,now()-interval '23 hours')`, [workspace.id, issues[0]!.id, issues[1]!.id, issues[9]!.id, agentA, agentC]);
            }, undefined);

            const scalar = async (sql: string, params: unknown[] = []) => Number((await db.query(sql, params)).rows[0]?.count ?? 0);
            const summary = {
              workspace: { id: workspace.id, slug: workspace.slug },
              workingAgents: await scalar(`SELECT count(*) FROM agent WHERE workspace_id=$1 AND status='working'`, [workspace.id]),
              onlineRuntimes: await scalar(`SELECT count(*) FROM agent_runtime WHERE workspace_id=$1 AND status='online'`, [workspace.id]),
              runningTasks: await scalar(`SELECT count(*) FROM agent_task_queue q JOIN agent a ON a.id=q.agent_id WHERE a.workspace_id=$1 AND q.status='running'`, [workspace.id]),
              dispatchedTasks: await scalar(`SELECT count(*) FROM agent_task_queue q JOIN agent a ON a.id=q.agent_id WHERE a.workspace_id=$1 AND q.status='dispatched'`, [workspace.id]),
              completedTasks: await scalar(`SELECT count(*) FROM agent_task_queue q JOIN agent a ON a.id=q.agent_id WHERE a.workspace_id=$1 AND q.status='completed'`, [workspace.id]),
              failedTasks: await scalar(`SELECT count(*) FROM agent_task_queue q JOIN agent a ON a.id=q.agent_id WHERE a.workspace_id=$1 AND q.status='failed'`, [workspace.id]),
              issues: await scalar(`SELECT count(*) FROM issue WHERE workspace_id=$1`, [workspace.id]),
              comments: await scalar(`SELECT count(*) FROM comment c JOIN issue i ON i.id=c.issue_id WHERE i.workspace_id=$1`, [workspace.id]),
              projects: await scalar(`SELECT count(*) FROM project WHERE workspace_id=$1`, [workspace.id]),
              skills: await scalar(`SELECT count(*) FROM skill WHERE workspace_id=$1`, [workspace.id]),
              squads: await scalar(`SELECT count(*) FROM squad WHERE workspace_id=$1`, [workspace.id]),
              autopilots: await scalar(`SELECT count(*) FROM autopilot WHERE workspace_id=$1`, [workspace.id]),
              autopilotRuns: await scalar(`SELECT count(*) FROM autopilot_run r JOIN autopilot a ON a.id=r.autopilot_id WHERE a.workspace_id=$1`, [workspace.id]),
              chatMessages: await scalar(`SELECT count(*) FROM chat_message m JOIN chat_session s ON s.id=m.chat_session_id WHERE s.workspace_id=$1`, [workspace.id]),
              inboxItems: await scalar(`SELECT count(*) FROM inbox_item WHERE workspace_id=$1`, [workspace.id]),
              warnings,
            };
            await writeFile(join(OUT, "seed-summary.json"), JSON.stringify(summary, null, 2) + "\n");
            if (summary.workingAgents < 2 || summary.runningTasks < 2 || summary.onlineRuntimes < 3) {
              throw new Error(`Rich seed incomplete: ${JSON.stringify(summary)}`);
            }

            const pub: [string,string,string?][] = [
              ["/", "/"], ["/homepage", "/homepage"], ["/about", "/about"], ["/changelog", "/changelog"],
              ["/contact-sales", "/contact-sales"], ["/download", "/download"], ["/usecases", "/usecases"],
              ["/usecases/[slug]", "/usecases/auto-data-analysis", "Representative use-case"],
              ["/invitations", "/invitations"], ["/invite/[id]", `/invite/${NIL}`, "Invalid invitation state"],
              ["/login", "/login"], ["/onboarding", "/onboarding"], ["/workspaces/new", "/workspaces/new"],
              ["/auth/callback", "/auth/callback?error=access_denied", "Callback error state"],
              ["/billing/return", "/billing/return?session_id=screenshot", "Return state without external billing session"],
              ["/join", "/join"], ["/dingtalk/bind", "/dingtalk/bind"], ["/lark/bind", "/lark/bind"],
              ["/slack/bind", "/slack/bind"], ["/telegram/bind", "/telegram/bind"], ["/wecom/bind", "/wecom/bind"],
            ];

            const ws = `/${workspace.slug}`;
            const auth: [string,string,string?][] = [
              ["/[workspaceSlug]/agents", `${ws}/agents`, "4 seeded agents: 2 working, 1 idle, 1 blocked"],
              ["/[workspaceSlug]/agents/[id]", `${ws}/agents/${agentA}`, "Working backend agent with active run"],
              ["/[workspaceSlug]/agents/new", `${ws}/agents/new`], ["/[workspaceSlug]/agents/new/ai", `${ws}/agents/new/ai`],
              ["/[workspaceSlug]/agents/new/ai/[sessionId]", `${ws}/agents/new/ai/${NIL}`, "Missing AI-builder session state"],
              ["/[workspaceSlug]/agents/new/manual", `${ws}/agents/new/manual`],
              ["/[workspaceSlug]/autopilots", `${ws}/autopilots`, "Active autopilot with completed/running/failed run history"],
              ["/[workspaceSlug]/autopilots/[id]", `${ws}/autopilots/${autopilotId}`, "Seeded autopilot detail with run history"],
              ["/[workspaceSlug]/billing", `${ws}/billing`],
              ["/[workspaceSlug]/chat", `${ws}/chat?session=${chatSessionId}`, "Seeded active agent conversation"],
              ["/[workspaceSlug]/inbox", `${ws}/inbox`, "Seeded review, blocker and completed-run notifications"],
              ["/[workspaceSlug]/issues", `${ws}/issues`, "12 seeded issues across all major workflow states"],
              ["/[workspaceSlug]/issues/[id]", `${ws}/issues/${issues[0]!.id}`, "In-progress urgent issue assigned to working agent"],
              ["/[workspaceSlug]/members/[id]", `${ws}/members/${userId}`, "Current E2E member"],
              ["/[workspaceSlug]/my-issues", `${ws}/my-issues`],
              ["/[workspaceSlug]/projects", `${ws}/projects`, "2 active projects"],
              ["/[workspaceSlug]/projects/[id]", `${ws}/projects/${projectA}`, "Seeded project detail"],
              ["/[workspaceSlug]/runtimes", `${ws}/runtimes`, "3 online runtimes"],
              ["/[workspaceSlug]/runtimes/[id]", `${ws}/runtimes/${runtimeA}`, "Online Codex runtime"],
              ["/[workspaceSlug]/runtimes/[id]/runtime/[runtimeId]", `${ws}/runtimes/${runtimeA}/runtime/${runtimeA}`, "Runtime settings route"],
              ["/[workspaceSlug]/settings", `${ws}/settings`],
              ["/[workspaceSlug]/skills", `${ws}/skills`, "2 seeded workspace skills attached to agents"],
              ["/[workspaceSlug]/skills/[id]", `${ws}/skills/${skillA}`, "Seeded skill detail"],
              ["/[workspaceSlug]/squads", `${ws}/squads`, "Platform Squad with 3 agent members"],
              ["/[workspaceSlug]/squads/[id]", `${ws}/squads/${squadId}`, "Seeded squad detail"],
              ["/[workspaceSlug]/usage", `${ws}/usage`],
              ["/[workspaceSlug]/attachments/[id]/preview", `${ws}/attachments/${NIL}/preview`, "Missing attachment state"],
            ];

            const rows: Row[] = [];
            let i = 0;
            for (const [template, path, note=""] of pub) await capture(browser, null, template, path, i++, note, rows);
            for (const [template, path, note=""] of auth) await capture(browser, token, template, path, i++, note, rows);
            await writeFile(join(OUT, "source-commit.txt"), process.env.GITHUB_SHA ?? "see workflow clone output");
            await db.end();
          });
          EOF

      - name: Capture screenshots
        working-directory: multica
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          FRONTEND_ORIGIN: http://localhost:3000
          DATABASE_URL: postgres://multica:multica@localhost:5432/multica?sslmode=disable
          SCREENSHOT_DIR: artifacts/multica-rich-screenshots
        run: pnpm exec playwright test e2e/chatgpt-rich-screenshots.spec.ts --project=chromium --reporter=line

      - name: Diagnostics
        if: failure()
        working-directory: multica
        run: docker compose -f docker-compose.selfhost.yml -f docker-compose.screenshots.yml logs --tail=300 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multica-rich-screenshots
          path: multica/artifacts/multica-rich-screenshots
          if-no-files-found: warn
          retention-days: 7
